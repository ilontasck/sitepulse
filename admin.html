<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations | NOQORI</title><link rel="stylesheet" href="/assets/noqori/admin.css"><script src="/assets/noqori/admin.js" defer></script></head>
<body><header><a href="/" aria-label="NOQORI home">NOQORI</a><span>OPERATIONS</span></header><main>
<section id="access"><p class="eyebrow">Operations</p><h1>Admin access</h1><form id="connectForm"><label for="adminKey">Admin API key</label><input id="adminKey" type="password" autocomplete="off" required><button>Connect</button></form><p id="accessStatus" role="alert"></p></section>
<div id="dashboard" hidden><div class="toolbar"><div><p class="eyebrow">Operations</p><h1>System overview</h1></div><button id="refresh">Refresh</button></div><p id="status" aria-live="polite"></p>
<div class="grid"><section><h2>System health</h2><dl id="health"></dl></section><section><h2>Queue</h2><dl id="queue"></dl></section><section><h2>Audit performance</h2><dl id="performance"></dl></section><section><h2>Users</h2><dl id="users"></dl></section><section><h2>Monthly quota</h2><dl id="quota"></dl></section></div>
<section><h2>Failed audits</h2><p id="failedError" role="alert"></p><div class="tableWrap"><table><thead><tr><th>Failed</th><th>Error</th><th>Attempts</th><th>Plan</th><th>Action</th></tr></thead><tbody id="failed"></tbody></table></div><button id="moreFailed" hidden>Load more</button></section>
<section><h2>Admin activity</h2><p id="logError" role="alert"></p><div class="tableWrap"><table><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Outcome</th></tr></thead><tbody id="log"></tbody></table></div><button id="moreLog" hidden>Load more</button></section></div>
</main></body></html>
